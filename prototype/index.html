<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#111318" />
  <title>mobilePCD Interaction Prototype</title>
  <link rel="stylesheet" href="./styles.css?v=notes-12" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icon.svg" type="image/svg+xml" />
  <meta name="mobile-web-app-capable" content="yes" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
  <main class="app-shell">
    <section class="workspace" aria-label="Interactive prototype">
      <section id="dialZone" class="control-panel dial-panel" aria-label="Theta relative control">
        <div class="dial-track" aria-hidden="true">
          <div class="theta-tick" style="top: 0%"><span>+π</span></div>
          <div class="theta-tick" style="top: 25%"><span>+½π</span></div>
          <div class="theta-tick" style="top: 50%"><span>0</span></div>
          <div class="theta-tick" style="top: 75%"><span>−½π</span></div>
          <div class="theta-tick" style="top: 100%"><span>−π</span></div>
          <div id="thetaMarker" class="theta-marker"></div>
          <div id="thetaMarkerGhost" class="theta-marker theta-marker-ghost"></div>
        </div>
      </section>

      <section class="visual-panel">
        <div id="threeContainer" class="three-container"></div>
      </section>

      <section class="control-panel radar-panel">
        <div class="radar-header">
          <strong>mobilePCD</strong>
        </div>
        <div id="radarPad" class="radar-pad" aria-label="Circular XY pad">
          <div class="axis axis-x"></div>
          <div class="axis axis-y"></div>
          <div id="radarPoint" class="radar-point"></div>
        </div>
        <div class="polar-grid">
          <div class="readout"><span>θ</span><strong id="dialValue">0.00π</strong></div>
          <div class="readout"><span>Φ</span><strong id="phiValue">0.00π</strong></div>
          <div class="readout"><span>r</span><strong id="radiusValue">0.00</strong></div>
        </div>
      </section>
    </section>

  </main>

  <script type="module" src="./app.js?v=notes-12"></script>
</body>
</html>
