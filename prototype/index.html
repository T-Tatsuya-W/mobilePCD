<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#111318" />
  <title>mobilePCD Interaction Prototype</title>
  <link rel="stylesheet" href="./styles.css?v=theta-sixths-1" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icon.svg" type="image/svg+xml" />
  <meta name="mobile-web-app-capable" content="yes" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
  <main class="app-shell">
    <section class="workspace" aria-label="Interactive prototype">
      <section id="thetaSliderPanel" class="control-panel theta-slider-panel" aria-label="Theta slider panel">
        <div class="theta-slider-track" aria-hidden="true">
          <div id="thetaMarker" class="theta-marker"></div>
          <div id="thetaMarkerGhost" class="theta-marker theta-marker-ghost"></div>
        </div>
      </section>

      <section class="torus-window-panel" aria-label="Torus window panel">
        <div id="torusWindow" class="torus-window"></div>
        <span id="micIndicator" class="mic-indicator" role="img" aria-label="Microphone active" hidden></span>
        <div id="pcdStrip" class="pcd-strip" aria-label="Pointer pitch class distribution"><div id="pcdBars" class="pcd-bars"></div></div>
        <div id="torusSettings" class="torus-settings" hidden>
          <h2>Torus geometry and nodes</h2>
          <label for="majorRadius">Major radius <output id="majorRadiusValue">1.55</output></label>
          <input id="majorRadius" type="range" min="0.90" max="2.20" step="0.01" value="1.55" />
          <label for="minorRadius">Minor radius <output id="minorRadiusValue">0.68</output></label>
          <input id="minorRadius" type="range" min="0.15" max="1.00" step="0.01" value="0.68" />
          <label for="plotNotes">Plot notes <input id="plotNotes" type="checkbox" checked /></label>
          <label for="plotChords">Plot chords <input id="plotChords" type="checkbox" /></label>
          <div class="settings-toggle-row"><span>Note names</span><button id="accidentalMode" type="button" aria-pressed="false">Sharps (♯)</button></div>
          <label for="noteConnections">Note connections <input id="noteConnections" type="checkbox" /></label>
          <label for="chordConnections">Chord connections <input id="chordConnections" type="checkbox" /></label>
          <h2>Theta slider settings</h2>
          <div class="settings-toggle-row"><span>Marker labels</span><button id="thetaLabelMode" type="button" aria-pressed="false">π fractions</button></div>
          <h2>Radar settings</h2>
          <label for="radarRange">Radar range <output id="radarRangeValue">0.25π</output></label>
          <input id="radarRange" type="range" min="0.01" max="0.50" step="0.01" value="0.25" />
          <h2>PCD display</h2>
          <label for="showPcd">Show PCD <input id="showPcd" type="checkbox" checked /></label>
          <div class="settings-toggle-row"><span>Show source</span><button id="pcdSourceToggle" type="button" aria-pressed="true">Pointer PCD</button></div>
          <h2>Mic to torus settings</h2>
          <button id="micToggle" class="mic-toggle" type="button" aria-pressed="false">Start mic</button>
          <div id="micStatus" class="mic-status" role="status" aria-live="polite">Mic off</div>
          <label for="micSensitivity">Mic light sensitivity <output id="micSensitivityValue">7.0×</output></label>
          <input id="micSensitivity" type="range" min="1" max="30" step="0.5" value="7" />
          <label for="pcdMinRms">Minimum input level <output id="pcdMinRmsValue">0.0010</output></label>
          <input id="pcdMinRms" type="range" min="0" max="0.02" step="0.0005" value="0.001" />
          <label for="pcdThreshold">Pitch bin threshold <output id="pcdThresholdValue">0.005</output></label>
          <input id="pcdThreshold" type="range" min="0" max="0.1" step="0.001" value="0.005" />
          <label for="pcdNormalize">PCD contrast <output id="pcdNormalizeValue">1.00</output></label>
          <input id="pcdNormalize" type="range" min="0.5" max="3" step="0.05" value="1" />
          <label for="pcdSmoothing">PCD smoothing <output id="pcdSmoothingValue">0.60</output></label>
          <input id="pcdSmoothing" type="range" min="0" max="0.95" step="0.05" value="0.6" />
          <label for="pcdMinHz">Low frequency <output id="pcdMinHzValue">50</output> Hz</label>
          <input id="pcdMinHz" type="range" min="30" max="400" step="10" value="50" />
          <label for="pcdMaxHz">High frequency <output id="pcdMaxHzValue">5000</output> Hz</label>
          <input id="pcdMaxHz" type="range" min="1000" max="8000" step="100" value="5000" />
          <label for="pcdRefA4">Reference A4 <output id="pcdRefA4Value">440</output> Hz</label>
          <input id="pcdRefA4" type="range" min="430" max="450" step="1" value="440" />
          <h2>Torus to audio settings</h2>
          <button id="audioToggle" class="mic-toggle" type="button" aria-pressed="false">Start audio</button>
          <div id="audioStatus" class="mic-status" role="status" aria-live="polite">Audio off</div>
          <label for="noteThreshold">Note threshold <output id="noteThresholdValue">0.17</output></label>
          <input id="noteThreshold" type="range" min="0" max="0.40" step="0.01" value="0.17" />
          <label for="outputVolume">Output volume <output id="outputVolumeValue">25%</output></label>
          <input id="outputVolume" type="range" min="0" max="0.50" step="0.01" value="0.25" />
          <div class="audio-octave-heading">Octaves</div>
          <div class="audio-octaves"><label><input class="audio-octave" type="checkbox" value="2" />2</label><label><input class="audio-octave" type="checkbox" value="3" />3</label><label><input class="audio-octave" type="checkbox" value="4" checked />4</label><label><input class="audio-octave" type="checkbox" value="5" />5</label><label><input class="audio-octave" type="checkbox" value="6" />6</label></div>
        </div>
      </section>

      <section class="control-panel main-panel" aria-label="Main panel">
        <div class="main-header">
          <strong>mobilePCD</strong>
        </div>
        <div id="radarPad" class="radar-pad" aria-label="Circular XY pad">
          <div class="axis axis-x"></div>
          <div class="axis axis-y"></div>
          <div id="radarPoint" class="radar-point"></div>
        </div>
        <div class="main-values">
          <div class="readout"><span>θ</span><strong id="thetaValue">0.00π</strong></div>
          <div class="readout"><span>Φ</span><strong id="phiValue">0.00π</strong></div>
          <div class="readout"><span>r</span><strong id="radiusValue">0.00</strong></div>
          <button id="settingsToggle" type="button" aria-controls="torusSettings" aria-expanded="false">Settings</button>
        </div>
      </section>
    </section>

  </main>

  <script type="module" src="./app.js?v=theta-sixths-1"></script>
</body>
</html>
